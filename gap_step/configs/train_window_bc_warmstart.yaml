seed: 53
device: auto
stages: [C2W0, C2W, C2B, C2C, C2D, C3, C3A, C3B, C3C]
episodes_per_stage: 12
epochs: 18
batch_size: 256
learning_rate: 0.0003
gnn_hidden_dim: 64
gnn_layers: 3
min_log_std: -3.0
max_log_std: -1.0
log_std_init: -1.6
checkpoint: checkpoints/window_generated/bc_warmstart.pt
env:
  return_graph_obs: true
  graph_mode: compact
  graph_max_cells: 128
  max_steps: 700
  period: 8
  max_step: 0.30
  robot_radius: 0.18
  random_phase_reset: true
