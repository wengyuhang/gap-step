   <g id="text_1">
    <text style="fill: #1a202c; font: 700 22px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="621" y="42.826594" transform="rotate(-0 621 42.826594)">拿到一个新的非凸窗口，应该怎么处理？</text>
   </g>
   <g id="text_2">
    <text style="fill: #4a5568; font: 12.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="621" y="66.082383" transform="rotate(-0 621 66.082383)">先判断边界来源，再统一成 vertices；之后所有类型走同一套三角剖分和优化流程。</text>
   </g>
   <g id="text_3">
    <text style="fill: #2b6cb0; font: 700 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="621" y="107.774275" transform="rotate(-0 621 107.774275)">新窗口边界</text>
   </g>
   <g id="text_4">
    <text style="fill: #1a202c; font: 9.3px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="477.3708" y="126.992587" transform="rotate(-0 477.3708 126.992587)">可能是顶点、圆弧、样条、SDF、图像轮廓等</text>
   </g>
   <g id="text_5">
    <text style="fill: #2f855a; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="258.858" y="203.0709" transform="rotate(-0 258.858 203.0709)">已经是有序顶点？</text>
   </g>
   <g id="text_6">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="121.3668" y="223.168525" transform="rotate(-0 121.3668 223.168525)">例如人工画的 U 形 / L 形</text>
   </g>
   <g id="text_7">
    <text style="fill: #6b46c1; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="621" y="203.0709" transform="rotate(-0 621 203.0709)">是光滑曲线？</text>
   </g>
   <g id="text_8">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="489.6468" y="223.168525" transform="rotate(-0 489.6468 223.168525)">圆弧、贝塞尔、参数曲线</text>
   </g>
   <g id="text_9">
    <text style="fill: #c05621; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="989.28" y="203.0709" transform="rotate(-0 989.28 203.0709)">是隐式/图像边界？</text>
   </g>
   <g id="text_10">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="857.9268" y="223.168525" transform="rotate(-0 857.9268 223.168525)">SDF、二值图、轮廓点云</text>
   </g>
   <g id="text_11">
    <text style="fill: #4a5568; font: 700 10px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="381.618" y="146.705906" transform="rotate(-0 381.618 146.705906)">情况 1</text>
   </g>
   <g id="text_12">
    <text style="fill: #4a5568; font: 700 10px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="670.104" y="154.097906" transform="rotate(-0 670.104 154.097906)">情况 2</text>
   </g>
   <g id="text_13">
    <text style="fill: #4a5568; font: 700 10px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="884.934" y="146.705906" transform="rotate(-0 884.934 146.705906)">情况 3</text>
   </g>
   <g id="text_14">
    <text style="fill: #2f855a; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="258.858" y="328.7349" transform="rotate(-0 258.858 328.7349)">直接清洗顶点</text>
   </g>
   <g id="text_15">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(121.3668 348.832525)">去重、检查闭合</text>
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(121.3668 360.787386)">统一逆时针 ensure_ccw</text>
   </g>
   <g id="text_16">
    <text style="fill: #6b46c1; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="621" y="328.7349" transform="rotate(-0 621 328.7349)">边界采样</text>
   </g>
   <g id="text_17">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(489.6468 348.832525)">曲率大处多采样</text>
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(489.6468 360.787386)">采样点按边界顺序连接</text>
   </g>
   <g id="text_18">
    <text style="fill: #c05621; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="989.28" y="328.7349" transform="rotate(-0 989.28 328.7349)">提取轮廓再采样</text>
   </g>
   <g id="text_19">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(857.9268 348.832525)">先得到外边界曲线</text>
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(857.9268 360.787386)">再转成有序顶点</text>
   </g>
   <g id="text_20">
    <text style="fill: #b7791f; font: 700 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="621" y="462.590275" transform="rotate(-0 621 462.590275)">共同检查：是否是无洞简单多边形？</text>
   </g>
   <g id="text_21">
    <text style="fill: #1a202c; font: 9.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="354.6108" y="482.208275" transform="rotate(-0 354.6108 482.208275)">要求：单条外边界、无自交、没有洞、顶点顺序正确</text>
   </g>
   <g id="text_22">
    <text style="fill: #c53030; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="240.444" y="594.8469" transform="rotate(-0 240.444 594.8469)">不满足</text>
   </g>
   <g id="text_23">
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(96.8148 614.944525)">带洞 / 自交 / 点序错误</text>
    <text style="fill: #1a202c; font: 9.4px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(96.8148 626.899386)">先修复或拆分，否则不进入优化</text>
   </g>
   <g id="text_24">
