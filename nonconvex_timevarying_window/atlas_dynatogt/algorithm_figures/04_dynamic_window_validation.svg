   <g id="text_1">
    <text style="fill: #1a202c; font: 700 22px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="39.869794" transform="rotate(-0 593.1 39.869794)">图解 3：动态窗口、世界坐标和最终验证</text>
   </g>
   <g id="text_2">
    <text style="fill: #4a5568; font: 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="64.002478" transform="rotate(-0 593.1 64.002478)">局部窗口 Ω(t) 先缩放，再由窗口姿态旋转到 3D 世界，最后平移到 center(t)。</text>
   </g>
   <g id="text_3">
    <text style="fill: #6b46c1; font: 700 14px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="218.124" y="139.47221" transform="rotate(-0 218.124 139.47221)">局部坐标 local=(u,v)</text>
   </g>
   <g id="text_4">
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 169.007525)">二维窗口平面内的点</text>
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 183.612775)">先在非凸区域 Ω(t) 内选点</text>
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 198.218025)">这一步由 chart atlas 保证</text>
   </g>
   <g id="text_5">
    <text style="fill: #2b6cb0; font: 700 14px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="604.818" y="139.47221" transform="rotate(-0 604.818 139.47221)">动态变换 P(t,local)</text>
   </g>
   <g id="text_6">
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 169.007525)">scale(t)：局部形状变大/变小</text>
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 183.612775)">rotation(t)：窗口平面转动</text>
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 198.218025)">center(t)：窗口中心平移</text>
   </g>
   <g id="text_7">
    <text style="fill: #2f855a; font: 700 14px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="979.794" y="139.90971" transform="rotate(-0 979.794 139.90971)">世界坐标 point</text>
   </g>
   <g id="text_8">
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 169.007525)">3D 轨迹真正经过的位置</text>
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 183.612775)">用于画 PNG/GIF</text>
    <text style="fill: #1a202c; font: 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 198.218025)">也用于导出 CSV 验证</text>
   </g>
   <g id="text_9">
    <text style="fill: #4a5568; font: 700 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="411.471" y="139.958897" transform="rotate(-0 411.471 139.958897)">代入 t</text>
   </g>
   <g id="text_10">
    <text style="fill: #4a5568; font: 700 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="798.165" y="139.958897" transform="rotate(-0 798.165 139.958897)">得到 3D 点</text>
   </g>
   <g id="text_11">
    <text style="fill: #2b6cb0; font: 700 15px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="264.378666" transform="rotate(-0 593.1 264.378666)">公式：point = center(t) + local_u · u_axis(t) + local_v · v_axis(t)</text>
   </g>
   <g id="text_12">
    <text style="fill: #c05621; font: 700 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="241.56" y="316.808878" transform="rotate(-0 241.56 316.808878)">t = 早一点</text>
   </g>
   <g id="text_13">
    <text style="fill: #c53030; font: 700 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="323.461678" transform="rotate(-0 593.1 323.461678)">t = 穿越时刻</text>
   </g>
   <g id="text_14">
    <text style="fill: #2f855a; font: 700 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="944.64" y="316.808878" transform="rotate(-0 944.64 316.808878)">t = 晚一点</text>
   </g>
   <g id="text_15">
    <text style="fill: #e53e3e; font: 700 12px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="469.547888" transform="rotate(-0 593.1 469.547888)">优化出的穿越点</text>
   </g>
   <g id="text_16">
    <text style="fill: #1a202c; font: 700 15px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="539.439585" transform="rotate(-0 593.1 539.439585)">最终验证清单：每个窗口穿越点都要过这几关</text>
   </g>
   <g id="text_17">
    <text style="fill: #1a202c; font: 11.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 568.575213)">contains=True：世界点投回局部后，必须在真实动态非凸区域 Ω_i(t_i) 内。</text>
    <text style="fill: #1a202c; font: 11.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 584.525982)">plane_error 小：点必须在当前窗口平面上，不能只是从旁边擦过去。</text>
    <text style="fill: #1a202c; font: 11.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 600.416107)">boundary_margin &gt; 0：点到非凸边界有正距离，说明在内部而不是边外。</text>
    <text style="fill: #1a202c; font: 11.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 615.751716)">chart_contains=True：局部点仍在它声明的三角 chart 内，说明 atlas 选择合法。</text>
   </g>
