   <g id="text_1">
    <text style="fill: #1a202c; font: 700 22px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="40.978594" transform="rotate(-0 593.1 40.978594)">图解 2：优化器到底在优化什么？</text>
   </g>
   <g id="text_2">
    <text style="fill: #4a5568; font: 13px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="66.220078" transform="rotate(-0 593.1 66.220078)">离散的 chart_id 先由 warm start 选好；L-BFGS-B 只优化连续变量：每段时间 duration 和每个窗口里的 z。</text>
   </g>
   <g id="text_3">
    <text style="fill: #1a202c; font: 700 15px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="130.070625" transform="rotate(-0 593.1 130.070625)">优化变量 x</text>
   </g>
   <g id="text_4">
    <text style="fill: #2b6cb0; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="158.3622" y="158.138688" transform="rotate(-0 158.3622 158.138688)">duration_0</text>
   </g>
   <g id="text_5">
    <text style="fill: #2b6cb0; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="287.2602" y="158.138688" transform="rotate(-0 287.2602 158.138688)">duration_1</text>
   </g>
   <g id="text_6">
    <text style="fill: #4a5568; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="388.035" y="158.138688" transform="rotate(-0 388.035 158.138688)">...</text>
   </g>
   <g id="text_7">
    <text style="fill: #2b6cb0; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="488.8098" y="158.138688" transform="rotate(-0 488.8098 158.138688)">duration_N</text>
   </g>
   <g id="text_8">
    <text style="fill: #6b46c1; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="617.7078" y="158.138688" transform="rotate(-0 617.7078 158.138688)">z_0=(u,v)</text>
   </g>
   <g id="text_9">
    <text style="fill: #6b46c1; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="746.6058" y="158.138688" transform="rotate(-0 746.6058 158.138688)">z_1=(u,v)</text>
   </g>
   <g id="text_10">
    <text style="fill: #4a5568; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="847.3806" y="158.138688" transform="rotate(-0 847.3806 158.138688)">...</text>
   </g>
   <g id="text_11">
    <text style="fill: #6b46c1; font: 700 8.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="948.1554" y="158.138688" transform="rotate(-0 948.1554 158.138688)">z_(N-1)</text>
   </g>
   <g id="text_12">
    <text style="fill: #2b6cb0; font: 11.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="311.868" y="225.196992" transform="rotate(-0 311.868 225.196992)">duration 累加得到穿越时间：t_i = duration_0 + ... + duration_i</text>
   </g>
   <g id="text_13">
    <text style="fill: #6b46c1; font: 11.5px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="862.614" y="225.196992" transform="rotate(-0 862.614 225.196992)">每个 z_i 通过所选 chart 映射为局部穿越点 local_i</text>
   </g>
   <g id="text_14">
    <text style="fill: #b7791f; font: 700 14px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="200.547" y="309.45125" transform="rotate(-0 200.547 309.45125)">Warm Start：先找好初值</text>
   </g>
   <g id="text_15">
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 336.69225)">按窗口顺序推进</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 351.03195)">枚举未来时间步</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 365.37165)">枚举 chart 候选点</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 379.71135)">评分：时间 + 距离 - 裕度奖励</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(79.8516 394.05105)">保留少量最优组合</text>
   </g>
   <g id="text_16">
    <text style="fill: #2f855a; font: 700 14px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="587.241" y="309.45125" transform="rotate(-0 587.241 309.45125)">L-BFGS-B：连续优化</text>
   </g>
   <g id="text_17">
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 336.69225)">输入：warm start 的 x0</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 351.03195)">变量有上下界</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 365.37165)">反复试探更小目标函数</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 379.71135)">输出：更优 duration 和 z</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(466.5456 394.05105)">chart_id 保持不变</text>
   </g>
   <g id="text_18">
    <text style="fill: #2b6cb0; font: 700 14px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="973.935" y="309.45125" transform="rotate(-0 973.935 309.45125)">Decode：还原轨迹</text>
   </g>
   <g id="text_19">
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 336.69225)">duration → crossing_times</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 351.094388)">z → local/world crossing_points</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 365.496525)">起点 + 穿越点 + 终点</text>
    <text style="fill: #1a202c; font: 10.8px 'Microsoft YaHei', 'DejaVu Sans', sans-serif" transform="translate(853.2396 379.836225)">Hermite 多项式连成轨迹</text>
   </g>
   <g id="text_20">
    <text style="fill: #c53030; font: 700 15px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="593.1" y="532.010625" transform="rotate(-0 593.1 532.010625)">目标函数 J：6 个代价项相加，越小越好</text>
   </g>
   <g id="text_21">
    <text style="fill: #c53030; font: 700 11px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle" x="247.419" y="598.113125" transform="rotate(-0 247.419 598.113125)">时间项</text>
   </g>
   <g id="text_22">
    <text style="fill: #1a202c; font: 9.3px 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start" x="126.7236" y="626.553188" transform="rotate(-0 126.7236 626.553188)">希望总飞行时间短</text>
   </g>
   <g id="text_23">
